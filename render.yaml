# Render Blueprint: a static site served straight from ./public (no build step)
services:
  - type: web
    name: homeboy
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /images/*
        name: Cache-Control
        value: public, max-age=2592000
